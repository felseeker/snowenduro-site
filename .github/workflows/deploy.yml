name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CRM_PUBLIC_PRODUCTS_URL: ${{ vars.CRM_PUBLIC_PRODUCTS_URL }}
      CRM_SYNC_QUEUE_URL: ${{ vars.CRM_SYNC_QUEUE_URL }}
      CRM_SYNC_CALLBACK_URL: ${{ vars.CRM_SYNC_CALLBACK_URL }}
      CRM_SYNC_CALLBACK_TOKEN: ${{ secrets.CRM_SYNC_CALLBACK_TOKEN }}
      NEXT_PUBLIC_CRM_URL: ${{ vars.NEXT_PUBLIC_CRM_URL }}
      NEXT_PUBLIC_CRM_LEADS_ENABLED: ${{ vars.NEXT_PUBLIC_CRM_LEADS_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check for a requested catalog publication
        id: sync
        if: ${{ env.CRM_SYNC_QUEUE_URL != '' }}
        run: node scripts/sync-crm-catalog.mjs

      - name: Save catalog and uploaded photos
        if: ${{ steps.sync.outputs.pending == 'true' && steps.sync.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.crm.json public/media/products
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync SnowEnduro catalog"
          fi

      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.sync.outputs.pending == 'true' }}
        run: npm ci

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'schedule' || steps.sync.outputs.pending == 'true' }}
        uses: actions/configure-pages@v5

      - name: Build static site
        if: ${{ github.event_name != 'schedule' || steps.sync.outputs.pending == 'true' }}
        run: npm run build

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'schedule' || steps.sync.outputs.pending == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ github.event_name != 'schedule' || steps.sync.outputs.pending == 'true' }}
        uses: actions/deploy-pages@v4

      - name: Mark catalog publication complete in CRM
        if: ${{ always() && steps.sync.outputs.pending == 'true' && steps.deployment.outcome == 'success' }}
        continue-on-error: true
        env:
          PUBLICATION_STATUS: succeeded
          PUBLICATION_ID: ${{ steps.sync.outputs.publication_id }}
        run: node scripts/notify-crm-catalog-publication.mjs

      - name: Mark catalog publication failed in CRM
        if: ${{ always() && steps.sync.outputs.pending == 'true' && job.status == 'failure' }}
        continue-on-error: true
        env:
          PUBLICATION_STATUS: failed
          PUBLICATION_ID: ${{ steps.sync.outputs.publication_id }}
        run: node scripts/notify-crm-catalog-publication.mjs
