name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - snowenduro_catalog_publish

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || !github.event.repository.private) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CRM_PUBLIC_PRODUCTS_URL: ${{ vars.CRM_PUBLIC_PRODUCTS_URL }}
      CRM_SYNC_CALLBACK_URL: ${{ vars.CRM_SYNC_CALLBACK_URL }}
      CRM_SYNC_CALLBACK_TOKEN: ${{ secrets.CRM_SYNC_CALLBACK_TOKEN }}
      PUBLICATION_ID: ${{ github.event.client_payload.publication_id }}
      NEXT_PUBLIC_CRM_URL: ${{ vars.NEXT_PUBLIC_CRM_URL }}
      NEXT_PUBLIC_CRM_LEADS_ENABLED: ${{ vars.NEXT_PUBLIC_CRM_LEADS_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Copy published catalog from CRM
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: node scripts/sync-crm-catalog.mjs

      - name: Save catalog and uploaded photos
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.crm.json public/media/products
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync SnowEnduro catalog"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark catalog publication complete in CRM
        if: ${{ always() && github.event_name == 'repository_dispatch' && steps.deployment.outcome == 'success' }}
        continue-on-error: true
        env:
          PUBLICATION_STATUS: succeeded
        run: node scripts/notify-crm-catalog-publication.mjs

      - name: Mark catalog publication failed in CRM
        if: ${{ always() && github.event_name == 'repository_dispatch' && job.status == 'failure' }}
        continue-on-error: true
        env:
          PUBLICATION_STATUS: failed
        run: node scripts/notify-crm-catalog-publication.mjs
